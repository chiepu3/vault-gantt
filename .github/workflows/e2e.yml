name: E2E

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Xvfb binary is spawned directly by tools/e2e/obsidian-runtime.mjs
      # (startXvfb), not via an xvfb-run wrapper, so it just needs to be
      # on PATH. libfuse2 is deliberately NOT installed here: the harness
      # always extracts the Obsidian AppImage via `--appimage-extract`,
      # which is documented as FUSE-free and never mounts the AppImage.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Pinned, SHA256-verified, root-owned install with the SUID sandbox
      # helper (Chromium sandbox stays enabled). No actions/cache is trusted.
      - name: Install Obsidian (sandbox-enabled)
        run: bash tools/e2e/ci-install-obsidian.sh

      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: tools/e2e/artifacts/*.png
          if-no-files-found: ignore

      # Harness-owned Xvfb/Obsidian stdout+stderr logs only (no user data,
      # env or vault content).
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: ${{ runner.temp }}/e2e-cache/logs/
          if-no-files-found: ignore
