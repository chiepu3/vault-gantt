name: Release

# On every push to main: pick the next version from the Conventional Commit prefix of the
# merged PR titles (feat -> minor, fix/other -> patch, docs/ci/chore/test only -> no release),
# commit the bump + CHANGELOG.md, tag vX.Y.Z and create a GitHub Release. See CONTRIBUTING.md.
#
# Loop guard: the bump commit is pushed with GITHUB_TOKEN, which never triggers workflows,
# and the job also skips commits whose message starts with "chore(release):".
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/release/release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
